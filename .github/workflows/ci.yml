name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dagger:
    name: pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          # The pipeline cross-compiles from source; generated Dagger bindings
          # are rebuilt by the engine, so they do not need to be committed.
          fetch-depth: 1

      - name: Run the Dagger pipeline
        # The GitHub Action lives in its own repository. The engine version
        # comes from the `version` input; dagger.json pins the same value for
        # local runs, and the pipeline asserts the two agree.
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: v0.20.8
          # The action already supplies the `call` verb, so this must be the
          # function only. Passing `args: call ci` instead produces
          # `dagger call call ci` and fails with "unknown command".
          call: ci
          # No secrets are passed in, and none are needed: the pipeline is
          # hermetic. It never reads the Midea inventory, never talks to a
          # device, and never contacts the vendor cloud. Anything that needed a
          # credential would not belong in CI.
